<!DOCTYPE html>
<html lang="en-IE">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Email your local councillors in minutes. Pick the issues you care about or write your own message, choose your area, and send it from your own Gmail or Outlook account.">

  <!-- The app is light only, whatever the device is set to. -->
  <meta name="color-scheme" content="light">
  <!-- The browser's own bar on a phone: the deep olive of the app's buttons and footer. -->
  <meta name="theme-color" content="#3F4B37">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CBAEngine">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Flutter sets the tab title from MaterialApp.title once it starts (lib/app.dart); keep the two the same. -->
  <title>CBAEngine - email your local councillors</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* What shows while the app downloads: plain white, as the app itself is. */
    html, body { background: #ffffff; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
